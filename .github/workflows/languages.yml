name: Atualizar linguagens

on:
  schedule:
    - cron: '0 * * * *'  # a cada hora
  workflow_dispatch:      # botão "Run workflow" na aba Actions
  push:
    paths:
      - '.github/scripts/languages.mjs'
      - '.github/workflows/languages.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar card de linguagens
        run: node .github/scripts/languages.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Salvar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/languages.svg
          git diff --cached --quiet || (git commit -m "Atualiza card de linguagens" && git push)
